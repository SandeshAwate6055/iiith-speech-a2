name: fusion_concat
data:
  meta: data/metadata.csv
  splits_dir: splits
  features_dir: data/features
  ssl_tag: wavlm_base_plus
model:
  fusion_type: concat
  fusion_dim: 256
  num_heads: 4
  num_classes: 7
  dropout: 0.3
  modality_dropout: 0.2
  speech_cfg:
    num_layers: 13
    in_dim: 768
    proj_dim: 256
    temporal_arch: gru
    temporal_hidden: 128
    temporal_layers: 1
    pooling: asp
    spec_mask_prob: 0.3
  text_cfg:
    model_name: FacebookAI/roberta-base
    n_finetune_layers: 2
    proj_dim: 256
train:
  seed: 42
  batch_size: 32
  epochs: 40
  patience: 8
  lr: 0.001
  encoder_lr: 2.0e-05
  weight_decay: 0.01
  label_smoothing: 0.1
